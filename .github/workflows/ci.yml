name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser-regressions:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        channel: [chrome, msedge]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.channel }} regressions
        shell: pwsh
        run: |
          $env:LITHEPAGE_BROWSER_CHANNEL = "${{ matrix.channel }}"
          pnpm test
